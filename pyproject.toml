[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-forge-ai-builder"
version = "0.6.3"
description = "Modular AI resume/CV generator for Windows desktop — parse, rewrite, score, and export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "resume-forge maintainers" }]
keywords = ["resume", "cv", "ai", "ats", "llm", "docx", "pdf", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup",
]

dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "rich>=13.7",
  "typer>=0.12",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "httpx>=0.27",
  "llama-cpp-python>=0.2.79 ; platform_system == 'Windows'",
  "onnxruntime>=1.18 ; platform_system == 'Windows'",
  "keyring>=25.2",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "types-PyYAML",
]
remote = ["openai>=1.30", "anthropic>=0.28"]
native = ["cffi>=1.16"]

[project.scripts]
resume-forge = "resume_forge.app:main"

[project.urls]
Homepage = "https://github.com/resume-forge/resume-forge-ai-builder"
Issues = "https://github.com/resume-forge/resume-forge-ai-builder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_forge = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["resume_forge"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=resume_forge --cov-report=term-missing"
asyncio_mode = "auto"